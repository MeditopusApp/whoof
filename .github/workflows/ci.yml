name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: web · vitest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test

  # The Python package is the legacy/reference backend and depends on the
  # vendored `whoop-reader` driver (vendor/ is gitignored, so it isn't present
  # on a clean CI checkout). The browser PWA — exercised by the `web` job above
  # — is the production code path. A Python job is intentionally omitted until
  # whoop-reader is published or vendored into the repo.
